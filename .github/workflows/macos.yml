name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope
        type: choice
        options: [full, shortcuts]
        default: full
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build universal app
        if: inputs.suite != 'shortcuts'
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        if: inputs.suite != 'shortcuts'
        with:
          name: Copy-Cat
          path: dist/Copy-Cat.zip
          if-no-files-found: error
      - name: Unit tests
        if: inputs.suite != 'shortcuts'
        run: ./scripts/test.sh -only-testing:MaccyTests -resultBundlePath .build/UnitTests.xcresult
      - name: UI tests
        if: inputs.suite != 'shortcuts'
        run: ./scripts/test.sh -only-testing:MaccyUITests -resultBundlePath .build/UITests.xcresult
      - name: Shortcut UI tests
        if: inputs.suite == 'shortcuts'
        run: >-
          ./scripts/test.sh
          -only-testing:MaccyUITests/MaccyUITests/testOpenAndClose
          -only-testing:MaccyUITests/MaccyUITests/testOpenAndSelectSecondItem
          -only-testing:MaccyUITests/MaccyUITests/testOpenAndSelectThirdItem
          -resultBundlePath .build/ShortcutTests.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: .build/*.xcresult
