name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build universal app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Copy-Cat
          path: dist/Copy-Cat.zip
          if-no-files-found: error
      - name: Unit tests
        run: ./scripts/test.sh -only-testing:MaccyTests -resultBundlePath .build/UnitTests.xcresult
      - name: UI tests
        run: ./scripts/test.sh -only-testing:MaccyUITests -resultBundlePath .build/UITests.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: .build/*.xcresult
